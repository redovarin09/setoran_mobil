name: ci

# Bukti hijau (status + URL run) adalah satu-satunya klaim "berhasil".
# Build/sign APK tetap di build.yml (main); job verify: install, analyze, test.
# Job e2e: integration_test di emulator headless, hanya saat PR siap-review
# (draft == false) atau workflow_dispatch — bukan tiap push (hemat kuota).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  e2e:
    name: e2e (integration_test, emulator headless)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    # Hemat kuota Actions: lewati push biasa; hanya PR siap-review / manual.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run E2E (headless emulator, retry di skrip)
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/e2e_ci.sh

      - name: Upload E2E logs saat gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}
          path: |
            build/
            test-results/
          if-no-files-found: warn
          retention-days: 14
